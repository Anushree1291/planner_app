# Azure DevOps pipeline: test → package → deploy to Azure App Service.
# Set up in the portal: see docs/DEPLOY_AZURE_PORTAL.md
#
# Edit the two values below to match what you created.

trigger:
  branches:
    include: [main]

pr: none

variables:
  azureServiceConnection: 'azure-planner-connection'   # Project settings → Service connections
  webAppName: 'anushree-planner'                       # your App Service name
  pythonVersion: '3.11'
  vmImageName: 'ubuntu-latest'

stages:
- stage: Test
  displayName: Run tests
  jobs:
  - job: Pytest
    pool:
      vmImage: $(vmImageName)
    steps:
    - task: UsePythonVersion@0
      inputs:
        versionSpec: '$(pythonVersion)'
      displayName: 'Use Python $(pythonVersion)'
    - script: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
      displayName: Install dependencies
    - script: pytest -q --junitxml=test-results.xml
      displayName: Run pytest
    - task: PublishTestResults@2
      condition: succeededOrFailed()
      inputs:
        testResultsFiles: test-results.xml
        testRunTitle: 'Planner tests'
      displayName: Publish test results

- stage: Build
  displayName: Package app
  dependsOn: Test
  jobs:
  - job: Package
    pool:
      vmImage: $(vmImageName)
    steps:
    # Only ship what the server needs. App Service installs requirements.txt itself
    # because SCM_DO_BUILD_DURING_DEPLOYMENT=true is set on the web app.
    - script: |
        mkdir -p $(Build.ArtifactStagingDirectory)/site
        cp -r app requirements.txt $(Build.ArtifactStagingDirectory)/site/
        find $(Build.ArtifactStagingDirectory)/site -name "__pycache__" -type d -prune -exec rm -rf {} +
      displayName: Collect files
    - task: ArchiveFiles@2
      inputs:
        rootFolderOrFile: '$(Build.ArtifactStagingDirectory)/site'
        includeRootFolder: false
        archiveType: zip
        archiveFile: '$(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip'
        replaceExistingArchive: true
      displayName: Zip package
    - publish: '$(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip'
      artifact: drop
      displayName: Upload package

- stage: Deploy
  displayName: Deploy to Azure
  dependsOn: Build
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
  - deployment: DeployWebApp
    pool:
      vmImage: $(vmImageName)
    environment: production        # add an approval check here if you like
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureWebApp@1
            displayName: 'Deploy to $(webAppName)'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              appType: webAppLinux
              appName: '$(webAppName)'
              package: '$(Pipeline.Workspace)/drop/$(Build.BuildId).zip'
              runtimeStack: 'PYTHON|3.11'
              startUpCommand: 'gunicorn -w 1 -k uvicorn.workers.UvicornWorker --timeout 120 --bind 0.0.0.0:8000 app.main:app'
          - script: |
              url="https://$(webAppName).azurewebsites.net"
              for i in $(seq 1 20); do
                if curl -fsS "$url/healthz"; then echo; echo "healthy"; exit 0; fi
                echo "waiting for app to start ($i)..."; sleep 15
              done
              echo "app did not become healthy"; exit 1
            displayName: Smoke test /healthz
